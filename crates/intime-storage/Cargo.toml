[package]
name = "intime-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-native-tls",
    "sqlite",
    "migrate",
    "chrono",
] }
intime-core = { path = "../intime-core" }
intime-ai = { path = "../intime-ai" }
blake3 = "1.5"
thiserror = "2.0.18"
async-trait = "0.1.89"
serde_json = "1.0.149"
sqlite-vec = "0.1.9"
libsqlite3-sys = "0.30.1" # Match sqlx version

tokio = { version = "1.52.1", features = ["full"] }
anyhow = "1.0.102"
